services:
  kubepilot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KUBEPILOT_SERVER_MODE=release
      - KUBEPILOT_DATABASE_DRIVER=postgres
      - KUBEPILOT_DATABASE_HOST=postgres
      - KUBEPILOT_DATABASE_USERNAME=kubepilot
      - KUBEPILOT_DATABASE_PASSWORD=kubepilot
      - KUBEPILOT_DATABASE_DBNAME=kubepilot
      - KUBEPILOT_CACHE_TYPE=redis
      - KUBEPILOT_CACHE_ADDR=redis:6379
      - KUBEPILOT_JWT_SECRET=CHANGE_YOUR_JWT_SECRET
    networks:
      - kubepilot-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=kubepilot
      - POSTGRES_PASSWORD=kubepilot
      - POSTGRES_DB=kubepilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubepilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubepilot-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubepilot-network

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - kubepilot-network

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - kubepilot-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  kubepilot-network:
    driver: bridge
