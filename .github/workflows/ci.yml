name: Test, scan and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  go:
    # Public pull requests must not execute on the persistent cluster host.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'k8s-master' }}
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOPATH: ${{ github.workspace }}/../.gopath
      GOCACHE: ${{ github.workspace }}/../.gocache
      HTTP_PROXY: ${{ github.event_name != 'pull_request' && secrets.CI_PROXY_URL || '' }}
      HTTPS_PROXY: ${{ github.event_name != 'pull_request' && secrets.CI_PROXY_URL || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
          cache: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: go.sum
      - run: go test ./...

  frontend:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'k8s-master' }}
    env:
      HTTP_PROXY: ${{ github.event_name != 'pull_request' && secrets.CI_PROXY_URL || '' }}
      HTTPS_PROXY: ${{ github.event_name != 'pull_request' && secrets.CI_PROXY_URL || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    needs: [go, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build runtime image
        run: docker build -f deploy/docker/Dockerfile -t kubepilot:ci .
      - name: Block fixable high/critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubepilot:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Sign in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image and immutable digest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kubepilot:ci "$repo:$GITHUB_SHA"
          docker push "$repo:$GITHUB_SHA" | tee /tmp/kubepilot-image-push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' /tmp/kubepilot-image-push.log | tail -1)
          test -n "$digest"
          docker tag kubepilot:ci "$repo:$GITHUB_REF_NAME"
          docker push "$repo:$GITHUB_REF_NAME"
          printf 'Scanned image: `%s@%s`\n' "$repo" "$digest" >> "$GITHUB_STEP_SUMMARY"
